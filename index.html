<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連番を簡単に生成！！</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  
  <style>
    #example4 {
      font-size: 26px;
      margin: 10px 0;
      background: linear-gradient(
        to right,
        #e60000,
        #f39800,
        #fff100,
        #009944,
        #0068b7,
        #1d2088,
        #920783,
        #e60000
      ) 0 / 200%;
      animation: 5s example4 linear infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes example4 {
      100% {
        background-position: 200%;
      }
    }
    .filter-container {
      margin: 15px 0;
      color: black;
    }
  </style>
</head>
<body>

  <a href="home.html">Yuki Youtube</a>

  <h1 id="example4">掲示板</h1>

  <div>
    新規さんへ、まずは挨拶をしましょう。シード値は自分のidを決めるものでパスワードのようなものです。<br>
    今の話題に勇気を出して参加してみましょう！！！<br>
    メッセージが送れない場合メッセージや名前が規制されている可能性があります。<br>
    <a href="use.html">使い方</a><br>
    <select id="channel-select">
      <option value="general">雑談</option>
      <option value="battle">バトルスタジアム</option>
    </select>
  </div>

  <form id="post-form">
    <label for="msg">メッセージ</label>
    <textarea
      name="message"
      rows="6"
      cols="100"
      maxlength="50"
      id="msg"
      required
    ></textarea>
    <p></p>
    <label for="name">名前</label>
    <input
      type="text"
      id="name"
      name="name"
      value=""
      maxlength="25"
      required
    />
    <label for="seed">シード</label>
    <input type="text" id="seed" name="seed" value="" required />
    <button type="submit" id="submit">送信する</button>
  </form>

  <div class="filter-container">
    <label for="speaker-filter">スピーカー以上のメッセージのみ表示</label>
    <input type="checkbox" id="speaker-filter">
  </div>

  <h2>投稿</h2>
  <h3 style="color: black; font-weight: bold;">
    今の話題：<span id="topic-prefix" style="display: none;"></span><span id="current-topic">特にありません</span>
  </h3>

  <table border="1">
    <thead>
      <tr>
        <th>No</th>
        <th>名前</th>
        <th>投稿</th>
      </tr>
    </thead>
    <tbody id="board-body">
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, serverTimestamp, update, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfigGeneral = {
      apiKey: "AIzaSyARQ86UM5HJENOkj0tVOYjGxMroGU7Gpbg",
      authDomain: "bbs-html-2602e.firebaseapp.com",
      databaseURL: "https://bbs-html-2602e-default-rtdb.firebaseio.com",
      projectId: "bbs-html-2602e",
      storageBucket: "bbs-html-2602e.firebasestorage.app",
      messagingSenderId: "705823930466",
      appId: "1:705823930466:web:36cd203ecf0a96b7c5f93b",
      measurementId: "G-H5222XRG5T"
    };

    const firebaseConfigBattle = {
      apiKey: "AIzaSyCPQf2LsXY7A7GPRUMz-iXtE76zfMC0OTs",
      authDomain: "battlestudium-bbs.firebaseapp.com",
      databaseURL: "https://battlestudium-bbs-default-rtdb.firebaseio.com",
      projectId: "battlestudium-bbs",
      storageBucket: "battlestudium-bbs.firebasestorage.app",
      messagingSenderId: "806890207931",
      appId: "1:806890207931:web:29a417057731e0e2d1479e",
      measurementId: "G-5K00RZEMV0"
    };

    const appGeneral = initializeApp(firebaseConfigGeneral, "general");
    const dbGeneral = getDatabase(appGeneral);

    const appBattle = initializeApp(firebaseConfigBattle, "battle");
    const dbBattle = getDatabase(appBattle);

    const OWNER_ID = "KF81wqJ";

    let activeChannel = localStorage.getItem('savedChannel') || "general";

    let state = {
      general: {
        messagesList: [],
        usersData: {},
        ngWordsMap: {},
        ngWordsList: [],
        maxPostsLimit: null,
        topic: { text: "特にありません", isOwner: false },
        bannedData: {},
        prohibitUntil: null
      },
      battle: {
        messagesList: [],
        usersData: {},
        ngWordsMap: {},
        ngWordsList: [],
        maxPostsLimit: null,
        topic: { text: "ここは無法地帯。", isOwner: false },
        bannedData: {},
        prohibitUntil: null
      }
    };

    let currentIp = "";

    const nameInput = document.getElementById('name');
    const seedInput = document.getElementById('seed');
    const msgInput = document.getElementById('msg');
    const speakerFilter = document.getElementById('speaker-filter');
    const channelSelect = document.getElementById('channel-select');

    channelSelect.value = activeChannel;

    if (localStorage.getItem('savedName')) nameInput.value = localStorage.getItem('savedName');
    if (localStorage.getItem('savedSeed')) seedInput.value = localStorage.getItem('savedSeed');

    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        currentIp = data.ip;
        checkBanStatus();
      }).catch(e => console.log("IP取得エラー"));

    function generateId(seed) {
      const hash = CryptoJS.SHA256(seed);
      const base64 = CryptoJS.enc.Base64.stringify(hash);
      return base64.replace(/[^a-zA-Z0-9]/g, '').substring(0, 7);
    }

    // 両チャンネルのユーザーデータを統合して取得する関数
    function getUserData(userId) {
      if (!userId) return {};
      const g = (state.general && state.general.usersData && state.general.usersData[userId]) || {};
      const b = (state.battle && state.battle.usersData && state.battle.usersData[userId]) || {};
      return {
        isOwner: Boolean(g.isOwner || b.isOwner),
        isSummit: Boolean(g.isSummit || b.isSummit),
        isModerator: Boolean(g.isModerator || b.isModerator),
        isManager: Boolean(g.isManager || b.isManager),
        isSpeaker: Boolean(g.isSpeaker || b.isSpeaker),
        nameColor: g.nameColor || b.nameColor || null,
        title: g.title || b.title || null,
        ip: g.ip || b.ip || null
      };
    }

    // 両データベースへの権限一括更新ヘルパー
    function updateBothUsers(targetId, data) {
      return Promise.all([
        update(ref(dbGeneral, `users/${targetId}`), data),
        update(ref(dbBattle, `users/${targetId}`), data)
      ]);
    }

    // 両データベースへのBAN一括更新ヘルパー
    function updateBothBanned(targetId, ip) {
      return Promise.all([
        update(ref(dbGeneral, 'settings/banned'), { [targetId]: ip }),
        update(ref(dbBattle, 'settings/banned'), { [targetId]: ip })
      ]);
    }

    function removeBothBanned(targetId) {
      return Promise.all([
        remove(ref(dbGeneral, `settings/banned/${targetId}`)),
        remove(ref(dbBattle, `settings/banned/${targetId}`))
      ]);
    }

    function checkBanStatus() {
      const seedVal = seedInput.value.trim();
      const currentUserId = seedVal ? generateId(seedVal) : null;
      
      const bannedIPsGen = Object.values(state.general.bannedData || {});
      const bannedIPsBat = Object.values(state.battle.bannedData || {});
      const allBannedIPs = [...bannedIPsGen, ...bannedIPsBat];
      
      const isBannedIp = currentIp && allBannedIPs.includes(currentIp);
      const isBannedIdGen = currentUserId && state.general.bannedData && state.general.bannedData.hasOwnProperty(currentUserId);
      const isBannedIdBat = currentUserId && state.battle.bannedData && state.battle.bannedData.hasOwnProperty(currentUserId);
      const isBannedId = Boolean(isBannedIdGen || isBannedIdBat);
      
      if (isBannedIp || isBannedId) {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>アクセスが禁止されています（BAN）</h1>";
      }
    }

    function isSpecialUser(userId) {
      if (userId === OWNER_ID || userId === "System" || userId === "Karupas") return true;
      const u = getUserData(userId);
      return Boolean(u.isOwner || u.isSummit || u.isModerator || u.isManager || u.isSpeaker);
    }

    function updateMaxLength() {
      const seedVal = seedInput.value.trim();
      const userId = seedVal ? generateId(seedVal) : null;
      msgInput.maxLength = (userId && isSpecialUser(userId)) ? 500 : 50;
    }
    
    seedInput.addEventListener('input', () => {
      updateMaxLength();
      checkBanStatus();
    });
    
    speakerFilter.addEventListener('change', renderBoard);

    channelSelect.addEventListener('change', (e) => {
      activeChannel = e.target.value;
      localStorage.setItem('savedChannel', activeChannel);
      checkBanStatus();
      renderBoard();
    });

    function linkify(text) {
      const container = document.createDocumentFragment();
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let lastIndex = 0;
      let match;
      while ((match = urlRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
        }
        const a = document.createElement('a');
        a.href = match[0];
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = match[0];
        container.appendChild(a);
        lastIndex = urlRegex.lastIndex;
      }
      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.substring(lastIndex)));
      }
      return container;
    }

    function formatOwnerMessage(htmlString) {
      const parser = new DOMParser();
      const parsedHtml = htmlString.replace(/\n/g, '<br>');
      const doc = parser.parseFromString(parsedHtml, 'text/html');
      
      function walk(node) {
        if (node.nodeType === 3) {
          const txt = node.nodeValue;
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          if (urlRegex.test(txt) && node.parentNode.tagName.toLowerCase() !== 'a') {
            const frag = document.createDocumentFragment();
            let lastIndex = 0;
            let match;
            urlRegex.lastIndex = 0;
            while ((match = urlRegex.exec(txt)) !== null) {
              if (match.index > lastIndex) {
                frag.appendChild(document.createTextNode(txt.substring(lastIndex, match.index)));
              }
              const a = document.createElement('a');
              a.href = match[0];
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = match[0];
              frag.appendChild(a);
              lastIndex = urlRegex.lastIndex;
            }
            if (lastIndex < txt.length) {
              frag.appendChild(document.createTextNode(txt.substring(lastIndex)));
            }
            node.parentNode.replaceChild(frag, node);
          }
        } else if (node.nodeType === 1) {
          Array.from(node.childNodes).forEach(walk);
        }
      }
      Array.from(doc.body.childNodes).forEach(walk);
      return doc.body.innerHTML;
    }

    setInterval(() => {
      if (state[activeChannel].prohibitUntil) renderBoard();
    }, 10000);

    function renderBoard() {
      updateMaxLength(); 
      const tbody = document.getElementById('board-body');
      const currentTopicSpan = document.getElementById('current-topic');
      const topicPrefix = document.getElementById('topic-prefix');
      const speakerOnly = speakerFilter.checked;
      tbody.innerHTML = ''; 

      const curState = state[activeChannel];
      const isBattle = (activeChannel === 'battle');

      // 雑談チャンネルの場合のみ禁止時間制限の表示を行う
      if (!isBattle && curState.prohibitUntil && Date.now() < curState.prohibitUntil) {
        const d = new Date(curState.prohibitUntil);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        topicPrefix.innerHTML = `<span style="color:red;">${hh}:${mm}まで青シードによる投稿禁止 </span>`;
        topicPrefix.style.display = "inline";
      } else {
        topicPrefix.style.display = "none";
      }

      for (let i = curState.messagesList.length - 1; i >= 0; i--) {
        const msg = curState.messagesList[i];
        const no = i + 1;
        const snap = msg.userSnapshot || {}; 

        let uData = getUserData(msg.userId);
        let isMsgOwner = snap.hasOwnProperty('isOwner') ? snap.isOwner : (msg.userId === OWNER_ID || uData.isOwner);
        let isMsgSummit = snap.hasOwnProperty('isSummit') ? snap.isSummit : uData.isSummit;
        let isMsgModerator = snap.hasOwnProperty('isModerator') ? snap.isModerator : uData.isModerator;
        let isMsgManager = snap.hasOwnProperty('isManager') ? snap.isManager : uData.isManager;
        let isMsgSpeaker = snap.hasOwnProperty('isSpeaker') ? snap.isSpeaker : uData.isSpeaker;
        let msgNameColor = snap.hasOwnProperty('nameColor') ? snap.nameColor : uData.nameColor;
        let msgTitle = snap.hasOwnProperty('title') ? snap.title : uData.title;

        const isMsgSpecial = isMsgOwner || isMsgSummit || isMsgModerator || isMsgManager || isMsgSpeaker || msg.userId === "System" || msg.userId === "Karupas";

        if (speakerOnly && !isMsgSpecial) continue; 

        if (!isBattle && !isMsgSpecial) {
          const containsNG = curState.ngWordsList.some(word => msg.message.includes(word));
          if (containsNG) continue; 
        }

        const tr = document.createElement('tr');
        
        const tdNo = document.createElement('td');
        tdNo.textContent = no;
        if (msg.timestamp) {
          const d = new Date(msg.timestamp);
          tdNo.title = d.toLocaleString('ja-JP'); 
        }
        tdNo.style.cursor = 'help';
        tr.appendChild(tdNo);

        const tdName = document.createElement('td');
        const tdMessage = document.createElement('td');

        tdName.style.cursor = 'pointer';
        tdName.title = "クリックしてIDをコピー";
        tdName.addEventListener('click', () => {
          navigator.clipboard.writeText(msg.userId).catch(e => console.log("コピー失敗:", e));
        });

        if (msg.isDeleted) {
          tdName.textContent = "削除されました";
          tdName.style.cursor = "default";
          tdName.title = "";
          tdMessage.textContent = "削除されました";
        } else {
          let displayName = msg.name;
          if (displayName !== undefined && displayName !== null && displayName.trim() === '' && displayName.length > 0) {
            displayName = ' ';
          } else if (!displayName && displayName !== ' ') {
            displayName = '名無し';
          }

          const spanName = document.createElement('span');
          spanName.style.whiteSpace = "pre";

          if (msg.userId === OWNER_ID || msg.userId === "System" || msg.userId === "Karupas" || isMsgOwner) {
            spanName.style.color = "red";
            spanName.innerHTML = displayName; 
            tdName.appendChild(spanName);
          } else {
            spanName.style.color = msgNameColor ? msgNameColor : "black";
            spanName.textContent = displayName; 
            tdName.appendChild(spanName);
            
            const spanId = document.createElement('span');
            if (isMsgSummit) spanId.style.color = "darkcyan";
            else if (isMsgModerator) spanId.style.color = "#9400d3";
            else if (isMsgManager) spanId.style.color = "red";
            else if (isMsgSpeaker) spanId.style.color = "#ff8c00";
            else spanId.style.color = "blue";
            
            spanId.textContent = `@${msg.userId}`; 
            tdName.appendChild(spanId);
          }

          if (msgTitle) {
            const spanTitle = document.createElement('span');
            spanTitle.style.color = "magenta";
            spanTitle.textContent = ` ${msgTitle}`;
            tdName.appendChild(spanTitle);
          }

          if (msg.userId === OWNER_ID || msg.userId === "System" || msg.userId === "Karupas" || isMsgOwner) {
            tdMessage.innerHTML = formatOwnerMessage(msg.message);
          } else {
            tdMessage.appendChild(linkify(msg.message));
          }
        }

        tr.appendChild(tdName);
        tr.appendChild(tdMessage);
        tbody.appendChild(tr);
      }
      
      if (isBattle) {
        const trSystem = document.createElement('tr');
        trSystem.innerHTML = `
          <td style="cursor: help;">0</td>
          <td><span style="color: red; white-space: pre;">System</span></td>
          <td>世界が始まったようだ…</td>
        `;
        tbody.appendChild(trSystem);
      }

      currentTopicSpan.innerHTML = '';
      if (isBattle) {
        currentTopicSpan.appendChild(linkify("ここは無法地帯。"));
      } else {
        if (curState.topic.isOwner) {
          currentTopicSpan.innerHTML = formatOwnerMessage(curState.topic.text);
        } else {
          currentTopicSpan.appendChild(linkify(curState.topic.text));
        }
      }
    }

    onValue(ref(dbGeneral, 'settings'), (snapshot) => {
      const s = snapshot.val() || {};
      state.general.ngWordsMap = s.ngWords || {};
      state.general.ngWordsList = Object.values(state.general.ngWordsMap);
      state.general.maxPostsLimit = s.maxPosts || null;
      if (typeof s.topic === 'string') {
        state.general.topic = { text: s.topic, isOwner: false };
      } else {
        state.general.topic = s.topic || { text: "特にありません", isOwner: false };
      }
      state.general.bannedData = s.banned || {};
      state.general.prohibitUntil = s.prohibitUntil || null;
      checkBanStatus(); 
      renderBoard();
    });

    onValue(ref(dbGeneral, 'users'), (snapshot) => {
      state.general.usersData = snapshot.val() || {};
      renderBoard();
    });

    onValue(ref(dbGeneral, 'messages'), (snapshot) => {
      state.general.messagesList = [];
      snapshot.forEach((childSnapshot) => {
        state.general.messagesList.push({ key: childSnapshot.key, ...childSnapshot.val() });
      });
      renderBoard();
    });

    onValue(ref(dbBattle, 'settings'), (snapshot) => {
      const s = snapshot.val() || {};
      state.battle.ngWordsMap = s.ngWords || {};
      state.battle.ngWordsList = Object.values(state.battle.ngWordsMap);
      state.battle.maxPostsLimit = s.maxPosts || null;
      state.battle.bannedData = s.banned || {};
      state.battle.prohibitUntil = s.prohibitUntil || null;
      checkBanStatus(); 
      renderBoard();
    });

    onValue(ref(dbBattle, 'users'), (snapshot) => {
      state.battle.usersData = snapshot.val() || {};
      renderBoard();
    });

    onValue(ref(dbBattle, 'messages'), (snapshot) => {
      state.battle.messagesList = [];
      snapshot.forEach((childSnapshot) => {
        state.battle.messagesList.push({ key: childSnapshot.key, ...childSnapshot.val() });
      });
      renderBoard();
    });

    document.getElementById('post-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const message = msgInput.value.trim();
      let name = nameInput.value;
      if (name.trim() === '' && name.length > 0) {
        name = ' ';
      }
      const seedVal = seedInput.value.trim();
      if (!message || !seedVal) return;

      const isBattle = (activeChannel === 'battle');
      const currentDb = isBattle ? dbBattle : dbGeneral;
      const curState = state[activeChannel];
      const messagesRefCur = ref(currentDb, 'messages');

      const userId = generateId(seedVal);
      const uData = getUserData(userId);
      const isSpec = isSpecialUser(userId);
      const charLimit = isSpec ? 500 : 50;
      const isNormalUser = !isSpec;

      if (message.length > charLimit) {
        alert(`文字数制限エラーです。あなたの権限では${charLimit}文字までです。`);
        return;
      }

      // 雑談チャンネルでのみ青シード規制を適用
      if (!isBattle && isNormalUser && curState.prohibitUntil && Date.now() < curState.prohibitUntil) {
        const d = new Date(curState.prohibitUntil);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        alert(`現在、青シードによる投稿は制限されています。（${hh}:${mm}まで）`);
        return;
      }

      // 雑談チャンネルでのみNGワードチェックを適用
      if (!isBattle && !isSpec) {
        const containsNG = curState.ngWordsList.some(word => message.includes(word));
        if (containsNG) {
          alert("NGワードが含まれているため投稿できません。");
          return;
        }
      }

      localStorage.setItem('savedName', name);
      localStorage.setItem('savedSeed', seedVal);

      let processPromises = [];
      let isClearExecuted = false;

      const isCmdRoot = (userId === OWNER_ID); 
      const isCmdOwner = isCmdRoot || (uData.isOwner === true);
      const isCmdSummit = (uData.isSummit === true);
      const isCmdModerator = (uData.isModerator === true);
      const isCmdManager = (uData.isManager === true);

      const isManagerOrHigher = isCmdOwner || isCmdSummit || isCmdModerator || isCmdManager;
      const isModeratorOrHigher = isCmdOwner || isCmdSummit || isCmdModerator;
      const isSummitOrHigher = isCmdOwner || isCmdSummit;

      if (currentIp) {
        processPromises.push(updateBothUsers(userId, { ip: currentIp }));
      }

      if (message.startsWith("/")) {
        if (message.startsWith("/topic ") && isManagerOrHigher) {
          if (isBattle) {
            alert("バトルスタジアムの話題は「ここは無法地帯。」で固定されています。");
          } else {
            const newTopic = message.substring(7).trim();
            processPromises.push(set(ref(dbGeneral, 'settings/topic'), {
              text: newTopic,
              isOwner: isCmdOwner
            }));
          }
        }
        else if (message.startsWith("/prohibit ")) {
          if (isBattle) {
            alert("バトルスタジアムでは/prohibitコマンドは無効です。");
          } else if (!isCmdOwner) {
            alert("権限がありません。Owner以上が必要です。");
          } else {
            const mins = parseInt(message.split(" ")[1], 10);
            if (!isNaN(mins) && mins > 0) {
              const endTime = Date.now() + mins * 60 * 1000;
              processPromises.push(set(ref(dbGeneral, 'settings/prohibitUntil'), endTime));
            }
          }
        }
        else if (message === "/permit") {
          if (isBattle) {
            alert("バトルスタジアムでは/permitコマンドは無効です。");
          } else if (!isCmdOwner) {
            alert("権限がありません。Owner以上が必要です。");
          } else {
            processPromises.push(remove(ref(dbGeneral, 'settings/prohibitUntil')));
          }
        }
        else if (message === "/disself") {
          if (!isCmdOwner) { 
            processPromises.push(updateBothUsers(userId, {
              isSummit: null,
              isModerator: null,
              isManager: null,
              isSpeaker: null,
              nameColor: null,
              title: null
            }));
          } else {
            alert("運営（Owner以上）は /disself を使用できません。");
          }
        }
        else if (message.startsWith("/owner ") || message.startsWith("/disowner ")) {
          if (!isCmdRoot) {
            alert("権限がありません。最高管理者(KF81wqJ)のみ実行可能です。");
          } else {
            const targetId = message.split(" ")[1];
            if (targetId) {
              if (targetId === OWNER_ID) {
                alert("自身(KF81wqJ)への権限変更は無効です。");
              } else {
                if (message.startsWith("/owner ")) processPromises.push(updateBothUsers(targetId, { isOwner: true }));
                else if (message.startsWith("/disowner ")) processPromises.push(updateBothUsers(targetId, { isOwner: false }));
              }
            }
          }
        }
        else if (message.startsWith("/ban ") || message.startsWith("/unban ")) {
          if (!isSummitOrHigher) {
            alert("権限がありません。サミット以上が必要です。");
          } else {
            if (message.startsWith("/ban ")) {
              const targetId = message.substring(5).trim();
              if (targetId) {
                const targetIp = getUserData(targetId).ip;
                processPromises.push(updateBothBanned(targetId, targetIp || "ID-ONLY"));
              }
            } else if (message.startsWith("/unban ")) {
              const targetId = message.substring(7).trim();
              if (targetId) {
                processPromises.push(removeBothBanned(targetId));
              }
            }
          }
        }
        else if (message === "/clear" || message.startsWith("/del ") || message.startsWith("/destroy ") || message.startsWith("/max ")) {
          if (!isManagerOrHigher) {
            alert("権限がありません。マネージャー以上が必要です。");
          } else {
            if (message === "/clear") {
              if (confirm("すべての投稿データを削除しますか？")) {
                isClearExecuted = true;
                if (!isBattle) {
                  // 雑談チャンネルで/clearが打たれた場合、初期コメントを追加
                  const karupasText = "ｶﾙﾊﾟｽ".repeat(33);
                  processPromises.push(
                    remove(messagesRefCur).then(() => {
                      return Promise.all([
                        push(messagesRefCur, { name: "System", userId: "System", message: "自動削除しました", isDeleted: false, timestamp: serverTimestamp() }),
                        push(messagesRefCur, { name: "カルパス財団", userId: "Karupas", message: karupasText, isDeleted: false, timestamp: serverTimestamp() })
                      ]);
                    })
                  );
                } else {
                  processPromises.push(remove(messagesRefCur));
                }
              } else return; 
            } 
            else if (message.startsWith("/max ")) {
              const maxNum = parseInt(message.substring(5).trim(), 10);
              if (!isNaN(maxNum) && maxNum > 0) processPromises.push(set(ref(currentDb, 'settings/maxPosts'), maxNum));
            }
            else if (message.startsWith("/del ")) {
              const parts = message.split(" ");
              parts.slice(1).forEach(p => {
                const targetNo = parseInt(p, 10);
                if (!isNaN(targetNo) && targetNo > 0 && targetNo <= curState.messagesList.length) {
                  processPromises.push(update(messagesRefCur, { [`${curState.messagesList[targetNo - 1].key}/isDeleted`]: true }));
                }
              });
            }
            else if (message.startsWith("/destroy ")) {
              const target = message.substring(9).trim();
              if (target === "e") {
                if (confirm("すべて削除状態にしますか？")) {
                  const updates = {};
                  curState.messagesList.forEach(m => { updates[m.key + '/isDeleted'] = true; });
                  processPromises.push(update(messagesRefCur, updates));
                } else return;
              } else if (target) {
                const updates = {};
                curState.messagesList.forEach(m => {
                  if (m.userId === target || (m.message && m.message.includes(target))) updates[m.key + '/isDeleted'] = true;
                });
                processPromises.push(update(messagesRefCur, updates));
              }
            }
          }
        }
        else if (message.startsWith("/add ") || message.startsWith("/color ") || message.startsWith("/speaker ") || message.startsWith("/disspeaker ") || message.startsWith("/NG ") || message.startsWith("/OK ")) {
          if (!isModeratorOrHigher) {
            alert("権限がありません。モデレーター以上が必要です。");
          } else {
            const parts = message.split(" ");
            if (message.startsWith("/NG ")) {
              const word = message.substring(4).trim();
              if(word) processPromises.push(push(ref(currentDb, 'settings/ngWords'), word));
            }
            else if (message.startsWith("/OK ")) {
              const word = message.substring(4).trim();
              if(word) {
                const key = Object.keys(curState.ngWordsMap).find(k => curState.ngWordsMap[k] === word);
                if(key) processPromises.push(remove(ref(currentDb, `settings/ngWords/${key}`)));
              }
            }
            else if (message.startsWith("/color ")) {
              const colorCode = parts[1];
              const targetId = parts[2];
              if (colorCode && targetId) processPromises.push(updateBothUsers(targetId, { nameColor: colorCode }));
            }
            else {
              const targetId = parts[1];
              if (targetId) {
                if (message.startsWith("/add ")) processPromises.push(updateBothUsers(targetId, { title: parts.slice(2).join(" ") }));
                else if (message.startsWith("/speaker ")) processPromises.push(updateBothUsers(targetId, { isSpeaker: true }));
                else if (message.startsWith("/disspeaker ")) processPromises.push(updateBothUsers(targetId, { isSpeaker: false }));
              }
            }
          }
        }
        else if (message.startsWith("/manager ") || message.startsWith("/dismanager ") || message.startsWith("/moderator ") || message.startsWith("/dismoderator ")) {
          if (!isSummitOrHigher) {
            alert("権限がありません。サミット以上が必要です。");
          } else {
            const targetId = message.split(" ")[1];
            if (targetId) {
              if (message.startsWith("/manager ")) processPromises.push(updateBothUsers(targetId, { isManager: true }));
              else if (message.startsWith("/dismanager ")) processPromises.push(updateBothUsers(targetId, { isManager: false }));
              else if (message.startsWith("/moderator ")) processPromises.push(updateBothUsers(targetId, { isModerator: true }));
              else if (message.startsWith("/dismoderator ")) processPromises.push(updateBothUsers(targetId, { isModerator: false }));
            }
          }
        }
        else if (message.startsWith("/summit ") || message.startsWith("/dissumit ")) {
          if (!isCmdOwner) {
            alert("権限がありません。運営のみ実行可能です。");
          } else {
            const targetId = message.split(" ")[1];
            if (targetId) {
              if (message.startsWith("/summit ")) processPromises.push(updateBothUsers(targetId, { isSummit: true }));
              else if (message.startsWith("/dissumit ")) processPromises.push(updateBothUsers(targetId, { isSummit: false }));
            }
          }
        }
      }

      const userSnapshot = {
        nameColor: uData.nameColor || null,
        title: uData.title || null,
        isOwner: isCmdOwner,
        isSummit: isCmdSummit,
        isModerator: isCmdModerator,
        isManager: isCmdManager,
        isSpeaker: uData.isSpeaker === true
      };

      const willExceedMax = !isClearExecuted && curState.maxPostsLimit && (curState.messagesList.length + 1 >= curState.maxPostsLimit);
      
      let pushMessageTask;
      if (willExceedMax) {
        pushMessageTask = remove(messagesRefCur).then(() => {
          const karupasText = "ｶﾙﾊﾟｽ".repeat(33);
          return Promise.all([
            push(messagesRefCur, { name: "System", userId: "System", message: "自動削除しました", isDeleted: false, timestamp: serverTimestamp() }),
            push(messagesRefCur, { name: "カルパス財団", userId: "Karupas", message: karupasText, isDeleted: false, timestamp: serverTimestamp() }),
            push(messagesRefCur, { name: name, userId: userId, message: message, isDeleted: false, timestamp: serverTimestamp(), userSnapshot: userSnapshot })
          ]);
        });
      } else {
        pushMessageTask = push(messagesRefCur, {
          name: name,
          userId: userId,
          message: message,
          isDeleted: false,
          timestamp: serverTimestamp(),
          userSnapshot: userSnapshot
        });
      }

      Promise.all(processPromises)
        .then(() => pushMessageTask)
        .then(() => {
          msgInput.value = '';
          window.location.reload(); 
        })
        .catch((error) => {
          console.error("Firebase Error: ", error);
          alert("処理に失敗しました。Firebase側のルール設定(Database Rules)が読み書き許可になっているか確認してください。");
        });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
  <script>window.addEventListener('load', () => new Darkmode().showWidget());</script>
</body>
